when:
  - event: push
    path:
      - 'dashboard.qmd'
      - 'custom.scss'
      - 'data/**'
  - event: manual

name: Deploy dashboard to shinyapps.io

steps:
  - name: Pull R image
    image: rocker/tidyverse
    commands:
      - 'Rscript -e renv::restore()'
  - name: Render dashboard
    image: cynkra/quarto-r:stable
    commands:
      - quarto render dasboard.qmd
  - name: Deploy shiny app
    commands:
      - 'Rscript -e deploy.R'
    environment:
      SHINYAPPS_NAME:
        from_secret: SHINYAPPS_NAME
      SHINYAPPS_TOKEN:
        from_secret: SHINYAPPS_TOKEN
      SHINYAPPS_SECRET:
        from_secret: SHINYAPPS_SECRET    
